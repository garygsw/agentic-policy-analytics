[project]
name = "policy-analytics-backend"
version = "0.1.0"
description = "Agentic policy data analytics: API, agents, ingestion"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "tiktoken>=0.8",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls real LLM providers (costs money); run with -m live"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
