# The whole system on one machine:
#   cp .env.example .env    # then add your keys, or: python3 scripts/set_keys.py
#   mkdir -p var
#   docker compose up --build
# Web UI: http://localhost:3000   API: http://localhost:8000/docs
#
# ./var holds the runtime state shared with local development: the document index, dataset caches, embedding
# models, conversations and reports. A fresh var/ starts with an empty document index; the ingest service fills
# it at 03:00 Singapore time, or run it at once with:
#   docker compose run --rm ingest python -m app.rag.scheduler --now
name: policy-analytics

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: policy-analytics-api
  env_file:
    - path: .env
      required: false  # without keys the API starts, but questions cannot be answered
  volumes:
    - ./var:/app/var
  restart: unless-stopped

services:
  api:
    <<: *backend
    ports:
      - "8000:8000"

  # The scheduled document ingestion (cron, see INGEST_CRON), as its own service.
  ingest:
    <<: *backend
    command: ["python", "-m", "app.rag.scheduler"]
    healthcheck:
      disable: true

  web:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: policy-analytics-web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
