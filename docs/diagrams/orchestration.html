<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic policy analytics · Multi-agent orchestration</title>
  <!-- Drawn with the diagram-design skill (swimlane, default skin). The PNG in this folder is exported from it. -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
            --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif;
            --font-mono: 'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1040px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Multi-agent orchestration</p>
    <h1>How the agents work together on one question</h1>
    <div class="diagram-container">
      <svg viewBox="0 40 1040 624" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="orchestration-title orchestration-desc">
        <title id="orchestration-title">How the agents work together on one question</title>
        <desc id="orchestration-desc">Swimlanes for the user, intake, the coordinator, the extraction agent, the analytics agent and reporting. The coordinator decides each step: it sends the extraction agent to load data, the analytics agent to compute facts and charts, then the report writer, whose report passes a code number check and a reviewer from the other provider before it reaches the user.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect y="40" width="100%" height="100%" fill="#f5f5f5"/>
        <rect y="40" width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- The coordinator's lane, tinted: it decides every step -->
        <rect x="144" y="224" width="872" height="80" fill="rgba(191,69,32,0.05)"/>

        <!-- Lane dividers and the label column -->
        <line x1="24" y1="64" x2="1016" y2="64" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="24" y1="144" x2="1016" y2="144" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="24" y1="224" x2="1016" y2="224" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="24" y1="304" x2="1016" y2="304" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="24" y1="384" x2="1016" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="24" y1="464" x2="1016" y2="464" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="24" y1="544" x2="1016" y2="544" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="144" y1="64" x2="144" y2="544" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

        <!-- Lane labels: who acts, and on which model -->
        <text x="32" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">USER</text>
        <text x="32" y="114" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">web UI</text>
        <text x="32" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">INTAKE</text>
        <text x="32" y="188" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">local classifier,</text>
        <text x="32" y="200" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">GPT 6 Luna if unsure</text>
        <text x="32" y="254" fill="#bf4520" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.18em">COORDINATOR</text>
        <text x="32" y="268" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Claude Sonnet 5.5</text>
        <text x="32" y="280" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">ReAct, up to 6 steps</text>
        <text x="32" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">EXTRACTION</text>
        <text x="32" y="348" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Claude Sonnet 5.5</text>
        <text x="32" y="360" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">tool loop</text>
        <text x="32" y="414" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ANALYTICS</text>
        <text x="32" y="428" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Claude Sonnet 5.5</text>
        <text x="32" y="440" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">tool loop, pandas</text>
        <text x="32" y="494" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">REPORT</text>
        <text x="32" y="508" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Claude writes,</text>
        <text x="32" y="520" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">GPT 6.1 Sol checks</text>

        <!-- Arrows (behind the steps) -->
        <line x1="204" y1="128" x2="204" y2="158" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="248" y1="160" x2="248" y2="130" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <path d="M 280,184 H 364 Q 372,184 372,192 V 238" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="372" y1="288" x2="372" y2="318" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 432,344 H 488 Q 496,344 496,336 V 290" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="552" y1="288" x2="552" y2="398" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 584,424 H 640 Q 648,424 648,416 V 290" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="704" y1="288" x2="704" y2="478" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="736" y1="504" x2="758" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="868" y1="504" x2="890" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Sent back to the writer, from the number check or the reviewer (at most two fixes) -->
        <path d="M 952,528 V 532 Q 952,538 946,538 H 808" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <path d="M 808,528 V 532 Q 808,538 802,538 H 682 Q 676,538 676,532 V 530" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <!-- The report reaches the user -->
        <line x1="976" y1="480" x2="976" y2="130" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Arrow labels, each on a mask -->
        <rect x="256" y="138" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="280" y="147" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLARIFY</text>
        <rect x="296" y="168" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="324" y="177" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN SCOPE</text>
        <rect x="380" y="306" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="404" y="315" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTRACT</text>
        <rect x="438" y="326" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="462" y="335" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SOURCES</text>
        <rect x="560" y="336" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="584" y="345" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ANALYSE</text>
        <rect x="590" y="406" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="612" y="415" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FACTS</text>
        <rect x="712" y="388" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="734" y="397" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPORT</text>
        <rect x="716" y="532" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="756" y="541" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FIX, AT MOST 2</text>
        <rect x="984" y="332" width="30" height="12" rx="2" fill="#f5f5f5"/>
        <text x="999" y="341" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PASS</text>

        <!-- Steps -->
        <rect x="160" y="80" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="220" y="101" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Question</text>
        <text x="220" y="115" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">in any of 4 languages</text>

        <rect x="160" y="160" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="220" y="181" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Intake</text>
        <text x="220" y="195" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">language · scope</text>

        <rect x="312" y="240" width="120" height="48" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
        <text x="372" y="261" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Coordinator</text>
        <text x="372" y="275" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">thinks: extract</text>

        <rect x="312" y="320" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="372" y="341" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Extraction agent</text>
        <text x="372" y="355" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">datasets · docs · web</text>

        <rect x="464" y="240" width="120" height="48" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
        <text x="524" y="261" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Coordinator</text>
        <text x="524" y="275" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">observes: analyse</text>

        <rect x="464" y="400" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="524" y="421" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Analytics agent</text>
        <text x="524" y="435" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">statistics · charts</text>

        <rect x="616" y="240" width="120" height="48" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
        <text x="676" y="261" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Coordinator</text>
        <text x="676" y="275" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">observes: report</text>

        <rect x="616" y="480" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="676" y="501" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Report writer</text>
        <text x="676" y="515" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cites facts, sources</text>

        <rect x="760" y="480" width="108" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="814" y="501" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Number check</text>
        <text x="814" y="515" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">code, not an LLM</text>

        <rect x="892" y="480" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="952" y="501" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reviewer</text>
        <text x="952" y="515" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">the other provider</text>

        <rect x="892" y="80" width="120" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="952" y="101" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Report</text>
        <text x="952" y="115" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cited · checked</text>

        <!-- Legend -->
        <line x1="24" y1="568" x2="1016" y2="568" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="24" y="584" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="24" y="596" width="14" height="10" rx="2" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
        <text x="44" y="604" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">A coordinator step: think, act, observe</text>
        <rect x="236" y="596" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="256" y="604" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">A step by an agent or a check</text>
        <rect x="412" y="596" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="432" y="604" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">What the user gets</text>
        <line x1="540" y1="601" x2="568" y2="601" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="576" y="604" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Hand-off</text>
        <line x1="640" y1="601" x2="668" y2="601" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="676" y="604" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sent back</text>
        <text x="24" y="636" fill="#4f5d75" font-size="8.5" font-style="italic" font-family="'Geist', sans-serif">The coordinator repeats think, act, observe until it can report, extracting or analysing again as needed. The reviewer can send a wrong analysis back to it once.</text>
        <text x="24" y="650" fill="#4f5d75" font-size="8.5" font-style="italic" font-family="'Geist', sans-serif">If the models fail, the user gets a template report of the computed figures. The LLMs never compute: every number must match a computed fact or a cited source.</text>
      </svg>
    </div>
  </div>
</body>
</html>
