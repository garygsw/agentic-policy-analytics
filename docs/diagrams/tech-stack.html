<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic policy analytics · Tech stack</title>
  <!-- Drawn with the diagram-design skill (layer stack, default skin). The PNG in this folder is exported from it. -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
            --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif;
            --font-mono: 'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack</p>
    <h1>The tech stack</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tech-stack-title tech-stack-desc">
        <title id="tech-stack-title">The tech stack</title>
        <desc id="tech-stack-desc">Six layers from the interface down to delivery: Next.js, FastAPI, LangGraph agents, Claude and GPT models, pandas and SQLite with the data sources, and Docker with GitHub Actions; the agents layer is highlighted.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Direction (left margin) -->
        <text x="40" y="68" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">USER</text>
        <line x1="80" y1="80" x2="80" y2="464" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <polygon points="76,80 84,80 80,72" fill="#4f5d75"/>
        <text x="40" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">MACHINE</text>

        <!-- Stack edges -->
        <line x1="120" y1="80" x2="960" y2="80" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <line x1="120" y1="464" x2="960" y2="464" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

        <!-- L6 Interface -->
        <rect x="120" y="80" width="840" height="64" fill="#f5f5f5"/>
        <line x1="120" y1="144" x2="960" y2="144" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text x="140" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L6</text>
        <text x="200" y="118" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Interface</text>
        <text x="940" y="118" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">Next.js 16 · React 19 · TypeScript · Plotly.js · vitest</text>

        <!-- L5 API and runs -->
        <rect x="120" y="144" width="840" height="64" fill="#f5f5f5"/>
        <line x1="120" y1="208" x2="960" y2="208" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text x="140" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L5</text>
        <text x="200" y="182" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">API and runs</text>
        <text x="940" y="182" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">FastAPI · Uvicorn · WebSocket · Pydantic · background runs</text>

        <!-- L4 Agents (focal) -->
        <rect x="120" y="208" width="840" height="64" fill="rgba(191,69,32,0.08)"/>
        <rect x="120" y="208" width="840" height="64" fill="none" stroke="#bf4520" stroke-width="1"/>
        <text x="140" y="244" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">L4</text>
        <text x="200" y="246" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Agents</text>
        <text x="940" y="246" fill="#bf4520" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">LangGraph · LangChain · ReAct tool loops · skills · checkpoints</text>

        <!-- L3 Models -->
        <rect x="120" y="272" width="840" height="64" fill="#f5f5f5"/>
        <line x1="120" y1="336" x2="960" y2="336" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text x="140" y="308" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
        <text x="200" y="310" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Models</text>
        <text x="940" y="310" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">Claude Sonnet 5.5 · GPT 6.1 Sol (fallback) · GPT 6 Luna · local embeddings</text>

        <!-- L2 Data and analysis -->
        <rect x="120" y="336" width="840" height="64" fill="#f5f5f5"/>
        <line x1="120" y1="400" x2="960" y2="400" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text x="140" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
        <text x="200" y="374" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Data and analysis</text>
        <text x="940" y="374" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">pandas · SQLite + FTS5 + sqlite-vec · matplotlib · data.gov.sg · FIRMS</text>

        <!-- L1 Delivery -->
        <rect x="120" y="400" width="840" height="64" fill="#f5f5f5"/>
        <text x="140" y="436" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
        <text x="200" y="438" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Delivery</text>
        <text x="940" y="438" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">Docker Compose · GitHub Actions · GHCR · gitleaks · uv · npm</text>

        <!-- Caption -->
        <text x="120" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCAL LAYER</text>
        <text x="216" y="508" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">The agents decide what to compute; every number comes from pandas below them, and every model call can fall back to the other provider.</text>
      </svg>
    </div>
  </div>
</body>
</html>
